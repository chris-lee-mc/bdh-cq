[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bdhx"
version = "0.1.0"
description = "BDH-CQ recurrent reasoning experiment framework"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.8",
  "numpy>=2.0",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "einops",
  "matplotlib",
  "pandas",
]

# The community BDH-CQ package (lucidrains/bdh-cq) is installed from git at
# commit c246f890 and is deliberately NOT a hard dependency here: adapters
# import it lazily so the framework stays importable without it.
#   pip install "bdh-cq @ git+https://github.com/lucidrains/bdh-cq@c246f890"

[project.optional-dependencies]
gpu = ["flash-linear-attention==0.5.2"]
runpod = ["runpod>=1.12"]
dev = ["pytest", "ruff==0.16.5"]

[tool.hatch.build.targets.wheel]
packages = ["bdhx"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Spec markdown is the contract: never let the formatter rewrite the code
# blocks quoted inside it.
extend-exclude = ["docs/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
